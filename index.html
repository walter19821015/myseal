<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./logo64.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>印章生成器</title>
    <link rel="stylesheet" crossorigin href="./index-B9o7yvK4.css">

    <style>
      /* 1. 彻底抹除图3底部整个深灰区域（按内容属性与高度特征精准锁定） */
      footer,
      [class*="footer"],
      .bg-\[\#1e293b\],
      .bg-slate-800,
      .bg-gray-800 {
        display: none !important;
        height: 0 !important;
        opacity: 0 !important;
        pointer-events: none !important;
      }

      /* 2. 隐藏图2顶部中间与右侧登录按钮 */
      /* 匹配包含“首页/印章模板/关于我们/联系我们”的导航容器 */
      header nav,
      header ul,
      nav ul {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" crossorigin src="./index-BeSQZLB_.js"></script>

    <script>
      (function() {
        function removeUnwantedNodes() {
          // A. 改名：左上角 DrawStamp -> 印章生成器
          var textElements = document.querySelectorAll('header *, nav *, h1, a, span, div');
          textElements.forEach(function(el) {
            if (el.children.length === 0 && (el.textContent || '').trim() === 'DrawStamp') {
              el.textContent = '印章生成器';
            }
          });

          // B. 物理移除图2部分：首页、印章模板、关于我们、联系我们、登录
          var badKeywords = ['首页', '印章模板', '关于我们', '联系我们', '登录'];
          var allClickables = document.querySelectorAll('header a, header button, nav a, nav button, header li, nav li');
          allClickables.forEach(function(el) {
            var text = (el.innerText || el.textContent || '').trim();
            for (var i = 0; i < badKeywords.length; i++) {
              if (text.indexOf(badKeywords[i]) !== -1) {
                // 向上找最近的独立按钮/链接标签，直接物理干掉
                var container = el.closest('button, a, li') || el;
                container.remove();
                break;
              }
            }
          });

          // C. 物理移除图3部分：底部整个深灰色栏
          var footers = document.querySelectorAll('footer');
          footers.forEach(function(el) {
            el.remove();
          });

          var deepDivs = document.querySelectorAll('div');
          deepDivs.forEach(function(el) {
            var txt = el.innerText || '';
            if (
              (txt.includes('DrawStamp. 保留所有权利') || 
               txt.includes('严禁用于任何非法用途') || 
               txt.includes('快速链接') || 
               txt.includes('法律信息')) &&
              !el.querySelector('canvas') &&
              !el.querySelector('#app')
            ) {
              // 找到深灰色背景的最外层父块直接整体移除
              var targetBox = el;
              while (targetBox.parentElement && targetBox.parentElement.tagName !== 'BODY' && !targetBox.parentElement.querySelector('canvas')) {
                if (targetBox.parentElement.id === 'app' || targetBox.parentElement.children.length > 2) break;
                targetBox = targetBox.parentElement;
              }
              targetBox.remove();
            }
          });
        }

        // 持续监控清除
        var observer = new MutationObserver(removeUnwantedNodes);
        observer.observe(document.body, { childList: true, subtree: true });

        var loopTimer = setInterval(removeUnwantedNodes, 50);
        setTimeout(function() {
          clearInterval(loopTimer);
        }, 12000);
      })();
    </script>
  </body>
</html>
