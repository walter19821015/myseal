<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./logo64.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>印章生成器</title>
    <link rel="stylesheet" crossorigin href="./index-B9o7yvK4.css">
  </head>
  <body>
    <div id="app"></div>
    <script type="module" crossorigin src="./index-BeSQZLB_.js"></script>

    <script>
      (function() {
        var navigated = false;

        function handleDomModifications() {
          // 1. 将左侧所有 "DrawStamp" 物理替换为 "印章生成器"
          var textNodes = document.querySelectorAll('header *, nav *, h1, a, span, div');
          textNodes.forEach(function(el) {
            if (el.children.length === 0 && el.textContent && el.textContent.trim() === 'DrawStamp') {
              el.textContent = '印章生成器';
            }
          });

          // 2. 找到“印章模板”按钮
          var allLinks = Array.from(document.querySelectorAll('header a, nav a, header button, nav button, span, div'));
          var stampBtn = allLinks.find(function(el) {
            return (el.innerText || el.textContent || '').trim() === '印章模板';
          });

          // 如果还没切入编辑页，且检测到了按钮：先模拟点击切进编辑页
          if (stampBtn && !navigated) {
            stampBtn.click();
            navigated = true;
          }

          // 3. 点击切入后（或者检测到元素已经在编辑台），物理删除“印章模板”这 4 个字及对应节点
          if (navigated && stampBtn) {
            stampBtn.remove();
          }

          // 4. 清理残留的外围多余项
          var links = document.querySelectorAll('header a, header button, nav a, nav button');
          links.forEach(function(el) {
            var txt = (el.innerText || el.textContent || '').trim();
            if (txt === '首页' || txt === '关于我们' || txt === '联系我们' || txt === '登录') {
              el.remove();
            }
          });

          var footers = document.querySelectorAll('footer');
          footers.forEach(function(el) { el.remove(); });
        }

        // 持续监听 DOM 渲染变化
        var observer = new MutationObserver(handleDomModifications);
        observer.observe(document.body, { childList: true, subtree: true });

        // 轮询触发，保证进站瞬间即刻响应
        var pollTimer = setInterval(handleDomModifications, 40);
        setTimeout(function() {
          clearInterval(pollTimer);
        }, 8000);
      })();
    </script>
  </body>
</html>
