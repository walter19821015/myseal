<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./logo64.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>印章生成器</title>

    <!-- 引用核心样式表 -->
    <link rel="stylesheet" crossorigin href="./index-B9o7yvK4.css">

    <style>
      /* 彻底隐藏顶部中间无用导航 */
      .nav-links,
      header .nav-links,
      nav .nav-links {
        display: none !important;
      }

      /* 彻底隐藏顶部右侧登录按钮 */
      .login-btn,
      header .login-btn,
      .user-actions {
        display: none !important;
      }

      /* 彻底隐藏底部版权与条款 */
      footer,
      .footer {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <!-- 引用核心逻辑 -->
    <script type="module" crossorigin src="./index-BeSQZLB_.js"></script>

    <script>
      (function() {
        // 1. 改名：左上角 DrawStamp -> 印章生成器
        var nameTimer = setInterval(function() {
          var logo = document.querySelector('.logo');
          if (logo) {
            logo.textContent = '印章生成器';
          }
        }, 50);

        // 2. 原地无缝切入编辑台，绝不修改浏览器物理地址栏（防止刷新404）
        var routeTimer = setInterval(function() {
          // 如果编辑台已经渲染，停止派发
          if (document.querySelector('canvas, .canvas-container, [class*="canvas"]')) {
            clearInterval(routeTimer);
            return;
          }

          // 自动触发内置路由的切换事件，原地切换视图
          var allLinks = Array.from(document.querySelectorAll('a, button, span'));
          var target = allLinks.find(function(el) {
            return (el.innerText || el.textContent || '').trim() === '印章模板';
          });

          if (target) {
            ['mousedown', 'mouseup', 'click'].forEach(function(evt) {
              target.dispatchEvent(new MouseEvent(evt, { bubbles: true, cancelable: true, view: window }));
            });
          }
        }, 30);

        setTimeout(function() {
          clearInterval(nameTimer);
          clearInterval(routeTimer);
        }, 8000);
      })();
    </script>
  </body>
</html>
