<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./logo64.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>印章制作工具</title>
    <link rel="stylesheet" crossorigin href="./index-B9o7yvK4.css">
  </head>
  <body>
    <div id="app"></div>
    <script type="module" crossorigin src="./index-BeSQZLB_.js"></script>

    <script>
      (function() {
        // 1. 彻底删除指定节点
        function purgeUnwanted() {
          // 物理删除顶部导航项：首页、关于我们、联系我们、登录
          var links = document.querySelectorAll('header a, header button, nav a, nav button');
          links.forEach(function(el) {
            var txt = (el.innerText || el.textContent || '').trim();
            if (txt === '首页' || txt === '关于我们' || txt === '联系我们' || txt === '登录') {
              el.remove();
            }
          });

          // 物理删除底部整个深色区域
          var footers = document.querySelectorAll('footer');
          footers.forEach(function(el) {
            el.remove();
          });

          var allDivs = document.querySelectorAll('div');
          allDivs.forEach(function(el) {
            var txt = el.innerText || '';
            if ((txt.includes('DrawStamp. 保留所有权利') || txt.includes('严禁用于任何非法用途')) && el.children.length > 0 && !el.querySelector('#app')) {
              el.remove();
            }
          });
        }

        // 2. 页面就绪后，直接物理模拟点击“印章模板”，原地切出编辑台且绝不改变 GitHub 根路径
        var clickTimer = setInterval(function() {
          var links = Array.from(document.querySelectorAll('a, button, span, div'));
          var target = links.find(function(el) {
            return (el.innerText || el.textContent || '').trim() === '印章模板';
          });

          if (target) {
            target.click();
            clearInterval(clickTimer);
          }
          purgeUnwanted();
        }, 50);

        // DOM 树变动持续清理
        var observer = new MutationObserver(purgeUnwanted);
        observer.observe(document.body, { childList: true, subtree: true });

        setTimeout(function() {
          clearInterval(clickTimer);
          purgeUnwanted();
        }, 5000);
      })();
    </script>
  </body>
</html>
