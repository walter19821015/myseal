<!doctype html>
<html lang="zh-CN">

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>印章生成器</title>

    <!-- 引用项目核心样式表 -->
    <link rel="stylesheet" crossorigin href="./index-B9o7yvK4.css">

    <style>
      /* 1. 彻底删除顶部中间导航：首页、印章模板、关于我们、联系我们 */
      .nav-links,
      header .nav-links,
      nav .nav-links {
        display: none !important;
      }

      /* 2. 彻底删除顶部右侧的登录按钮 */
      .login-btn,
      header .login-btn,
      .user-actions {
        display: none !important;
      }

      /* 3. 彻底删除底部整块深灰色的版权与法律条款 */
      footer,
      .footer {
        display: none !important;
      }
    </style>

  <body>
    <div id="app"></div>

    <!-- 引用核心逻辑 -->
    <script type="module" crossorigin src="./index-BeSQZLB_.js"></script>

    <script>
      // 页面挂载后，将左上角 DrawStamp 替换为 印章生成器
      (function() {
        var timer = setInterval(function() {
          var logo = document.querySelector('.logo');
          if (logo) {
            logo.textContent = '印章生成器';
          }
        }, 50);

        setTimeout(function() {
          clearInterval(timer);
        }, 6000);
      })();
    </script>
