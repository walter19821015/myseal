    <!-- 导出模板弹窗 -->
    <div id="popup-template-dialog" class="native-modal-overlay">
      <div class="native-modal-window tpl-modal-box">
        <div class="tpl-modal-title">导出模板</div>
        <div class="tpl-modal-center-label">请输入印章模板标题</div>
        <input id="custom-tpl-title" type="text" class="tpl-input-field" value="印章类型" />

        <div class="tpl-modal-center-label" style="margin-top: 18px;">
          请输入印章分类 (可填多个，使用空格分隔，例如：书法印章 有机印章 节气)
        </div>
        <input id="custom-tpl-tags" type="text" class="tpl-input-field-gray" placeholder="请输入印章分类 (可填多个，使用空格分隔，例如：书法印章 有机印章 节气)" />

        <div style="display:flex;justify-content:flex-end;gap:12px;margin-top:24px;">
          <button id="btn-close-tpl" type="button" class="btn-tpl-cancel">取消</button>
          <button id="btn-save-tpl-action" type="button" class="btn-tpl-confirm">导出</button>
        </div>
      </div>
    </div>

    <!-- 选择导出格式弹窗 -->
    <div id="popup-export-dialog" class="native-modal-overlay">
      <div class="native-modal-window fmt-modal-box">
        <div class="fmt-modal-title">选择导出格式</div>
        <div class="fmt-header-tip">请选择您要导出的图片格式：</div>

        <!-- PNG -->
        <div class="fmt-option-card active" onclick="changeFmt(this, 'png')">
          <span class="fmt-badge">🖼️</span>
          <span style="font-weight:600;width:60px;font-size:14px;text-align:left;color:#1f2937;">PNG</span>
          <span style="font-size:12px;color:#8c8c8c;">支持透明背景，适合打印</span>
        </div>

        <!-- JPEG -->
        <div class="fmt-option-card" onclick="changeFmt(this, 'jpeg')">
          <span class="fmt-badge">📷</span>
          <span style="font-weight:600;width:60px;font-size:14px;text-align:left;color:#1f2937;">JPEG</span>
          <span style="font-size:12px;color:#8c8c8c;">文件较小，适合网络分享</span>
        </div>

        <!-- SVG -->
        <div class="fmt-option-card" onclick="changeFmt(this, 'svg')">
          <span class="fmt-badge">📐</span>
          <span style="font-weight:600;width:60px;font-size:14px;text-align:left;color:#1f2937;">SVG</span>
          <span style="font-size:12px;color:#8c8c8c;">矢量格式，可无损缩放</span>
        </div>

        <!-- JPEG专属质量滑块 -->
        <div id="jpeg-quality-wrap" style="display:none;margin-top:14px;margin-bottom:14px;">
          <div id="quality-val-label" style="text-align:center;font-size:13px;color:#333;margin-bottom:8px;">图片质量：70%</div>
          <input id="quality-slider" type="range" min="10" max="100" value="70" class="slider-track" oninput="updateQuality(this.value)" />
        </div>

        <hr style="border:none;border-top:1px solid #f0f0f0;margin:14px 0;" />

        <!-- 导出尺寸 -->
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <span style="font-size:13px;font-weight:600;color:#1f2937;">导出尺寸</span>
          <span style="font-size:12px;color:#52c41a;cursor:pointer;" onclick="setRatio('origin')">恢复默认尺寸</span>
        </div>

        <!-- 固定比例 -->
        <div style="text-align:center;font-size:13px;font-weight:600;color:#1f2937;margin-bottom:8px;">固定比例</div>
        <div style="display:flex;gap:8px;justify-content:center;margin-bottom:8px;">
          <button id="ratio-btn-origin" type="button" class="ratio-pill-btn active" onclick="setRatio('origin')">原始比例</button>
          <button id="ratio-btn-square" type="button" class="ratio-pill-btn" onclick="setRatio('square')">正方形</button>
          <button id="ratio-btn-4-3" type="button" class="ratio-pill-btn" onclick="setRatio('4:3')">4 : 3</button>
          <button id="ratio-btn-16-9" type="button" class="ratio-pill-btn" onclick="setRatio('16:9')">16 : 9</button>
          <button id="ratio-btn-custom" type="button" class="ratio-pill-btn" onclick="setRatio('custom')">自定义</button>
        </div>

        <div style="text-align:center;font-size:12px;color:#e53e3e;margin-bottom:10px;">选择固定宽高比，或使用自定义尺寸</div>

        <!-- 宽高输入框 -->
        <div style="display:flex;gap:18px;justify-content:center;align-items:center;">
          <div style="text-align:center;">
            <div style="font-size:12px;color:#595959;margin-bottom:4px;">宽度 (px)</div>
            <input id="dyn-inp-w" type="number" value="420" oninput="onWidthChange(this.value)" style="width:120px;height:34px;text-align:center;border:1px solid #d9d9d9;border-radius:4px;outline:none;" />
          </div>
          <div style="text-align:center;">
            <div style="font-size:12px;color:#595959;margin-bottom:4px;">高度 (px)</div>
            <input id="dyn-inp-h" type="number" value="320" oninput="onHeightChange(this.value)" style="width:120px;height:34px;text-align:center;border:1px solid #d9d9d9;border-radius:4px;outline:none;" />
          </div>
        </div>

        <div style="font-size:12px;color:#e53e3e;text-align:center;margin-top:10px;">默认尺寸：420px × 320px</div>
        <div style="font-size:12px;color:#e53e3e;text-align:center;margin-top:2px;">支持 100px - 4096px 范围</div>

        <div style="display:flex;justify-content:flex-end;gap:12px;margin-top:20px;">
          <button id="btn-close-exp" type="button" class="btn-tpl-cancel">取消</button>
          <button id="btn-do-exp-action" type="button" class="btn-tpl-confirm">导出</button>
        </div>
      </div>
    </div>

    <script type="module" crossorigin src="./index-BeSQZLB_.js"></script>

    <script>
      window.curFormat = 'png';
      window.curRatio = 'origin';

      window.changeFmt = function(el, fmt) {
        document.querySelectorAll('.fmt-option-card').forEach(function(c) { c.classList.remove('active'); });
        el.classList.add('active');
        window.curFormat = fmt;

        var qWrap = document.getElementById('jpeg-quality-wrap');
        qWrap.style.display = (fmt === 'jpeg') ? 'block' : 'none';
      };

      window.updateQuality = function(val) {
        document.getElementById('quality-val-label').textContent = '图片质量：' + val + '%';
      };

      window.setRatio = function(ratioType) {
        window.curRatio = ratioType;
        document.querySelectorAll('.ratio-pill-btn').forEach(function(b) { b.classList.remove('active'); });

        var wInp = document.getElementById('dyn-inp-w');
        var hInp = document.getElementById('dyn-inp-h');
        var baseW = parseInt(wInp.value) || 420;

        if (ratioType === 'origin') {
          document.getElementById('ratio-btn-origin').classList.add('active');
          wInp.value = 420;
          hInp.value = 320;
        } else if (ratioType === 'square') {
          document.getElementById('ratio-btn-square').classList.add('active');
          hInp.value = baseW;
        } else if (ratioType === '4:3') {
          document.getElementById('ratio-btn-4-3').classList.add('active');
          hInp.value = Math.round(baseW * (3 / 4));
        } else if (ratioType === '16:9') {
          document.getElementById('ratio-btn-16-9').classList.add('active');
          hInp.value = Math.round(baseW * (9 / 16));
        } else if (ratioType === 'custom') {
          document.getElementById('ratio-btn-custom').classList.add('active');
        }
      };

      window.onWidthChange = function(w) {
        var valW = parseInt(w) || 0;
        var hInp = document.getElementById('dyn-inp-h');
        if (window.curRatio === 'square') {
          hInp.value = valW;
        } else if (window.curRatio === '4:3') {
          hInp.value = Math.round(valW * (3 / 4));
        } else if (window.curRatio === '16:9') {
          hInp.value = Math.round(valW * (9 / 16));
        } else if (window.curRatio === 'origin') {
          hInp.value = Math.round(valW * (320 / 420));
        }
      };

      window.onHeightChange = function() {
        if (window.curRatio !== 'custom') {
          document.querySelectorAll('.ratio-pill-btn').forEach(function(b) { b.classList.remove('active'); });
          document.getElementById('ratio-btn-custom').classList.add('active');
          window.curRatio = 'custom';
        }
      };

      (function() {
        setInterval(function() {
          var logo = document.querySelector('.logo');
          if (logo && logo.textContent !== '印章生成器') {
            logo.textContent = '印章生成器';
          }
        }, 150);

        function mountTranslate() {
          if (document.getElementById('lang-dropdown-wrapper')) return;
          var navContainer = document.querySelector('.nav-content') || document.querySelector('.navbar') || document.querySelector('header');
          if (!navContainer) return;

          if (typeof translate !== 'undefined') {
            translate.selectLanguageTag.show = false;
            translate.service.use('client.edge');
            translate.execute();
          }

          var wrapper = document.createElement('div');
          wrapper.id = 'lang-dropdown-wrapper';
          wrapper.innerHTML = `
            <a href="https://walter19821015.ccwu.cc" class="nav-header-btn">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
              <span>首页</span>
            </a>
            <div style="position:relative;display:flex;align-items:center;height:100%;">
              <button id="langMenuBtn" type="button" class="nav-header-btn">
                <span>🌐 语言</span>
                <span style="font-size:10px;opacity:0.7;">▼</span>
              </button>
              <div id="langMenu" style="display:none;position:absolute;right:0;top:calc(100% + 6px);width:120px;background:#ffffff;border-radius:8px;box-shadow:0 10px 25px rgba(0,0,0,0.12);border:1px solid #e5e7eb;overflow:hidden;z-index:999999;padding:4px 0;">
                <a href="javascript:translate.changeLanguage('chinese_simplified');" style="display:block;padding:8px 14px;color:#374151;font-size:13px;text-decoration:none;">简体中文</a>
                <a href="javascript:translate.changeLanguage('english');" style="display:block;padding:8px 14px;color:#374151;font-size:13px;text-decoration:none;">English</a>
                <a href="javascript:translate.changeLanguage('spanish');" style="display:block;padding:8px 14px;color:#374151;font-size:13px;text-decoration:none;">Español</a>
                <a href="javascript:translate.changeLanguage('arabic');" style="display:block;padding:8px 14px;color:#374151;font-size:13px;text-decoration:none;">العربية</a>
              </div>
            </div>
          `;

          navContainer.appendChild(wrapper);

          var btn = document.getElementById('langMenuBtn');
          var menu = document.getElementById('langMenu');
          btn.onclick = function(e) {
            e.stopPropagation();
            menu.style.display = menu.style.display === 'none' ? 'block' : 'none';
          };
          document.addEventListener('click', function(e) {
            if (!wrapper.contains(e.target)) menu.style.display = 'none';
          });
          menu.onclick = function() {
            menu.style.display = 'none';
          };
        }
        var mountTimer = setInterval(mountTranslate, 150);
        setTimeout(function() { clearInterval(mountTimer); }, 8000);

        function restoreTemplateImages() {
          var imgs = document.querySelectorAll('.template-list img, .template-grid img, .template-preview img, .template-preview-small img, [class*="template"] img');
          imgs.forEach(function(img) {
            if (img.dataset.sourceHooked) return;
            img.onerror = function() {
              if (this.dataset.fallbackDone) return;
              this.dataset.fallbackDone = "true";
              var path = this.getAttribute('src') || '';
              var filename = path.split('/').pop();
              this.src = 'https://drawstamp.com/assets/' + filename;
            };

            var curSrc = img.getAttribute('src');
            if (curSrc && !curSrc.startsWith('http') && !curSrc.startsWith('data:')) {
              img.dataset.sourceHooked = "true";
              var clean = curSrc.replace(/^\.\//, '/').replace(/^\/+/, '/');
              img.src = 'https://drawstamp.com' + clean;
            }
          });
        }
        setInterval(restoreTemplateImages, 300);

        var popupTpl = document.getElementById('popup-template-dialog');
        var popupExp = document.getElementById('popup-export-dialog');

        document.getElementById('btn-close-tpl').onclick = function() { popupTpl.style.display = 'none'; };
        document.getElementById('btn-close-exp').onclick = function() { popupExp.style.display = 'none'; };

        popupTpl.onclick = function(e) { if (e.target === popupTpl) popupTpl.style.display = 'none'; };
        popupExp.onclick = function(e) { if (e.target === popupExp) popupExp.style.display = 'none'; };

        document.getElementById('btn-save-tpl-action').onclick = function() {
          var title = document.getElementById('custom-tpl-title').value.trim() || '印章模板';
          var data = localStorage.getItem('drawstamp_current_stamp') || '{}';
          var blob = new Blob([data], { type: 'application/json' });
          var link = document.createElement('a');
          link.download = title + '.json';
          link.href = URL.createObjectURL(blob);
          link.click();
          popupTpl.style.display = 'none';
        };

        // ================= 严格精准裁切：获取纯印章内容（0标尺，0网格） =================
        document.getElementById('btn-do-exp-action').onclick = function() {
          popupExp.style.display = 'none';

          var targetW = parseInt(document.getElementById('dyn-inp-w').value) || 420;
          var targetH = parseInt(document.getElementById('dyn-inp-h').value) || 320;
          var fmt = window.curFormat || 'png';
          var quality = parseInt(document.getElementById('quality-slider').value) / 100;

          // 获取原版印章 SVG 标签（只有纯印章文字、红圈，不包含标尺网格）
          var stampSvg = document.querySelector('.stamp-workspace svg, .canvas-container svg, .stamp-svg, svg[id*="stamp"]');
          if (!stampSvg) {
            // 兜底：从非操作栏的 SVG 中筛选
            stampSvg = Array.from(document.querySelectorAll('svg')).find(function(s) {
              return !s.closest('.nav-content') && !s.closest('#lang-dropdown-wrapper') && !s.closest('.canvas-footer') && s.clientWidth > 50;
            });
          }

          // A. 导出 SVG
          if (fmt === 'svg') {
            var svgData = stampSvg ? (new XMLSerializer()).serializeToString(stampSvg) : '';
            if (svgData) {
              var blob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
              var link = document.createElement('a');
              link.download = 'mystamp.svg';
              link.href = URL.createObjectURL(blob);
              link.click();
              return;
            }
          }

          // B. 导出 PNG / JPEG
          if (stampSvg) {
            // 从纯净 SVG 重新绘制到离屏 Canvas，绝对不含外层标尺网格
            var sData = (new XMLSerializer()).serializeToString(stampSvg);
            var svgBlob = new Blob([sData], { type: 'image/svg+xml;charset=utf-8' });
            var url = URL.createObjectURL(svgBlob);
            var img = new Image();
            img.onload = function() {
              var outCanvas = document.createElement('canvas');
              outCanvas.width = targetW;
              outCanvas.height = targetH;
              var ctx = outCanvas.getContext('2d');

              if (fmt === 'jpeg') {
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, targetW, targetH);
              }

              ctx.drawImage(img, 0, 0, targetW, targetH);
              URL.revokeObjectURL(url);

              var link = document.createElement('a');
              link.download = 'mystamp.' + fmt;
              link.href = outCanvas.toDataURL(fmt === 'jpeg' ? 'image/jpeg' : 'image/png', quality);
              link.click();
            };
            img.src = url;
            return;
          }

          // 如果没有找到 SVG，从主 Canvas 自动裁剪掉四周的标尺边界
          var allCanvases = Array.from(document.querySelectorAll('canvas'));
          var mainCanvas = allCanvases[allCanvases.length - 1];
          if (mainCanvas) {
            var outCanvas = document.createElement('canvas');
            outCanvas.width = targetW;
            outCanvas.height = targetH;
            var ctx = outCanvas.getContext('2d');

            if (fmt === 'jpeg') {
              ctx.fillStyle = '#ffffff';
              ctx.fillRect(0, 0, targetW, targetH);
            }

            // 标尺宽度通常占据左上角 20~30px，从纯净区域切取印章
            var rulerOffset = 25;
            var sw = Math.max(1, mainCanvas.width - rulerOffset);
            var sh = Math.max(1, mainCanvas.height - rulerOffset);

            ctx.drawImage(mainCanvas, rulerOffset, rulerOffset, sw, sh, 0, 0, targetW, targetH);

            var link = document.createElement('a');
            link.download = 'mystamp.' + fmt;
            link.href = outCanvas.toDataURL(fmt === 'jpeg' ? 'image/jpeg' : 'image/png', quality);
            link.click();
          }
        };

        function bindAllActionButtons() {
          var btns = document.querySelectorAll('.canvas-footer .canvas-action-btn, .canvas-action-btn');
          if (!btns || btns.length < 4) return;

          // 第 4 个软盘图标
          var fourthBtn = btns[3];
          if (fourthBtn) {
            fourthBtn.removeAttribute('disabled');
            fourthBtn.style.opacity = '1';
            fourthBtn.style.filter = 'none';

            Array.from(fourthBtn.childNodes).forEach(function(n) {
              if (n.nodeType === Node.TEXT_NODE && n.textContent.trim()) {
                n.textContent = '';
              }
            });

            if (!fourthBtn.dataset.strictExpBound) {
              fourthBtn.dataset.strictExpBound = "true";
              fourthBtn.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                e.stopImmediatePropagation();
                popupExp.style.display = 'flex';
              }, true);
            }
          }

          // 第 2 个上箭头图标
          var secondBtn = btns[1];
          if (secondBtn && !secondBtn.dataset.strictTplBound) {
            secondBtn.dataset.strictTplBound = "true";
            secondBtn.addEventListener('click', function(e) {
              e.preventDefault();
              e.stopPropagation();
              e.stopImmediatePropagation();
              popupTpl.style.display = 'flex';
            }, true);
          }
        }

        setInterval(bindAllActionButtons, 100);
      })();
    </script>
  </body>
</html>
