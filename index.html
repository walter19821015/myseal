<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./logo64.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>印章生成器</title>

    <!-- 引用核心样式表 -->
    <link rel="stylesheet" crossorigin href="./index-B9o7yvK4.css">

    <style>
      /* 1. 隐藏多余导航与页脚 */
      .nav-links, .login-btn, .user-actions, footer, .footer {
        display: none !important;
      }

      /* 2. 彻底隐藏右上角的语言切换组件 (Language 下拉框) */
      .language-switch,
      .nav-right,
      header select,
      nav select {
        display: none !important;
      }

      /* 针对模板卡片内的图片优化：防止裂图撑破布局 */
      .template-item img,
      .template-preview img,
      .template-preview-small img {
        object-fit: contain;
        width: 100%;
        height: 100%;
      }

      /* 抹除破损图标红叉边框 */
      img[data-broken="true"] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <script type="module" crossorigin src="./index-BeSQZLB_.js"></script>

    <script>
      (function() {
        // 1. 改名：左上角 DrawStamp -> 印章生成器
        setInterval(function() {
          var logo = document.querySelector('.logo');
          if (logo && logo.textContent !== '印章生成器') {
            logo.textContent = '印章生成器';
          }
        }, 100);

        // 2. 物理彻底移除右上角 Language 语言切换节点
        function removeLanguageSwitch() {
          var langNodes = document.querySelectorAll('.language-switch, .nav-right');
          langNodes.forEach(function(el) {
            el.remove();
          });
        }
        setInterval(removeLanguageSwitch, 100);

        // 3. 保证无论刷新还是初次加载都留在 /myseal/
        if (location.pathname.indexOf('/maker') !== -1) {
          history.replaceState(null, '', '/myseal/');
        }

        // 4. 自动触发进入编辑台
        var initTimer = setInterval(function() {
          if (document.querySelector('canvas, .canvas-container')) {
            clearInterval(initTimer);
            if (location.pathname !== '/myseal/') {
              history.replaceState(null, '', '/myseal/');
            }
            return;
          }

          var btns = Array.from(document.querySelectorAll('a, button, span'));
          var target = btns.find(function(el) {
            return (el.innerText || el.textContent || '').trim() === '印章模板';
          });
          if (target) {
            target.click();
          }
        }, 30);

        // 5. 补全/修复模板缩略图标
        function fixBrokenImages() {
          var imgs = document.querySelectorAll('.template-list img, .template-grid img, .template-preview img, .template-preview-small img, [class*="template"] img');
          imgs.forEach(function(img) {
            if (img.dataset.hasHooked) return;
            img.dataset.hasHooked = "true";

            img.onerror = function() {
              var currentSrc = img.src;
              if (img.dataset.triedOriginal === "true") {
                img.setAttribute('data-broken', 'true');
                return;
              }
              img.dataset.triedOriginal = "true";
              var relativePath = currentSrc.replace(window.location.origin, '').replace(/^\/myseal/, '');
              img.src = 'https://drawstamp.com' + relativePath;
            };
          });
        }

        var imgObserver = new MutationObserver(fixBrokenImages);
        imgObserver.observe(document.body, { childList: true, subtree: true });
        setInterval(fixBrokenImages, 300);
      })();
    </script>
  </body>
</html>
