<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./logo64.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>印章生成器</title>

    <!-- 引用核心样式表 -->
    <link rel="stylesheet" crossorigin href="./index-B9o7yvK4.css">

    <style>
      /* 隐藏多余导航与页脚 */
      .nav-links, .login-btn, .user-actions, footer, .footer {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <script type="module" crossorigin src="./index-BeSQZLB_.js"></script>

    <script>
      (function() {
        // 1. 改名
        setInterval(function() {
          var logo = document.querySelector('.logo');
          if (logo && logo.textContent !== '印章生成器') {
            logo.textContent = '印章生成器';
          }
        }, 100);

        // 2. 核心：如果地址栏误入了 /maker 导致刷新会404，立刻修正回 /myseal/
        if (location.pathname.indexOf('/maker') !== -1) {
          history.replaceState(null, '', '/myseal/');
        }

        // 3. 原地触发：进站直接把编辑器点开，且地址栏稳稳锁在 /myseal/
        var timer = setInterval(function() {
          if (document.querySelector('canvas, .canvas-container')) {
            clearInterval(timer);
            // 确保渲染后地址依然在 /myseal/，怎么刷新都不丢
            if (location.pathname !== '/myseal/') {
              history.replaceState(null, '', '/myseal/');
            }
            return;
          }

          var btns = Array.from(document.querySelectorAll('a, button, span'));
          var target = btns.find(function(el) {
            return (el.innerText || el.textContent || '').trim() === '印章模板';
          });

          if (target) {
            target.click();
          }
        }, 30);
      })();
    </script>
  </body>
</html>
